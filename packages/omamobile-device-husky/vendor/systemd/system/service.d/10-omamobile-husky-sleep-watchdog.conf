# SPDX-License-Identifier: MIT
# Omarchy Mobile, Pixel 8 Pro: no service watchdogs, for every system service.
#
# systemd's service watchdogs count on CLOCK_MONOTONIC. The kernel stops
# that clock in s2idle only when the idle loop enters a cpuidle state
# through its s2idle callback (tick_freeze() in enter_s2idle_proper()). An
# 8 Pro sleep never gets there: zuma's device tree has no idle states and
# there is no cpuidle driver (/sys/devices/system/cpu/cpuidle/current_driver
# reads "none"). So the clock runs through the sleep while every service is
# frozen, and at the thaw systemd aborts the ones whose WatchdogSec (3 min
# for journald, logind, udevd, resolved, homed, userdbd...) has passed.
#
# Measured on one 8 Pro, one run each, 2026-11-15 (omarchy-mobile#765): a 270 s sleep,
# CLOCK_MONOTONIC +270.4 s, then "Watchdog timeout (limit 3min)!" for
# logind, journald and nsresourced; with logind restarted, NetworkManager
# kept every device unmanaged until it was restarted. With WatchdogSec=0 in
# place from boot the same sleep had no timeout and no restart.
#
# The same two settings as the Pixel 9a's drop-in (omarchy-mobile#766).
# Remove it when an 8 Pro sleep stops the clock (idle states entered
# through s2idle), not before. It has to be here at boot: a running
# service keeps the watchdog it was started with.
[Service]
WatchdogSec=0
